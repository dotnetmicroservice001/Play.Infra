envVariables:
  ServiceSettings__MessageBroker: SERVICEBUS
  ServiceSettings__KeyVaultName: playeconomyapp
  SeqSettings__Host: seq.observability
  SeqSettings__Port: 5341
  JaegerSettings__Host: jaeger-query.observability
  JaegerSettings__Port: 6831
    
resources:
  limits:
    memory: "128Mi"
    cpu: "150m"
    
container:
  readiness:
    path: /health/ready
    initialDelaySeconds: 15
    periodSeconds: 15
    failureThreshold: 3
  liveness:
    path: /health/live
    initialDelaySeconds: 15
    periodSeconds: 15
    failureThreshold: 3
  
service: 
  type: ClusterIP
  port: 80
        
    